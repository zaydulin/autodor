<body>
<style>
    /* Базовые стили для десктопа */
    h1 {
      font-size: 24px;
      margin-bottom: 10px;
      color: #2c3e50;
      text-align: center;
    }

    #callStatus {
      font-size: 16px;
      margin-bottom: 20px;
      font-weight: bold;
      color: #2980b9;
      text-align: center;
    }

    #participants {
      display: flex;
      gap: 40px;
      margin-bottom: 30px;
      width: 100%;
      justify-content: center;
    }

    .participant {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      border-radius: 20px;
      border: 2px solid transparent;
      transition: border 0.3s, box-shadow 0.3s;
      cursor: default;
      width: 180px;
      font-size: 18px;
    }

    .avatar-call {
      width: 150px;
      height: 150px;
      border-radius: 50%;
      overflow: hidden;
      margin-bottom: 15px;
      border: 3px solid transparent;
    }

    .avatar-call img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .name {
      font-weight: bold;
      font-size: 20px;
      margin-bottom: 10px;
      text-align: center;
    }

    .participant.active {
      border-color: #27ae60;
      box-shadow: 0 0 20px rgba(39, 174, 96, 0.6);
    }

    #call-controls {
      display: flex;
      gap: 20px;
      margin-bottom: 20px;
      flex-wrap: wrap;
      justify-content: center;
    }

    button {
      padding: 14px 28px;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.3s, transform 0.2s;
    }

    #callBtn {
      background-color: #2980b9;
      color: #fff;
    }

    #cancelBtn {
      background-color: #c0392b;
      color: #fff;
    }

    #muteBtn {
      background-color: #f39c12;
      color: #fff;
    }

    button:hover {
      opacity: 0.9;
      transform: scale(1.05);
    }

    button:active {
      transform: scale(0.98);
    }

    audio {
      display: none;
    }

    /* Стиль для кнопки "Назад" */
    .back-button {
      position: absolute;
      top: 20px;
      left: 20px;
      display: flex;
      align-items: center;
      padding: 8px 12px;
      background: transparent;
      border: none;
      cursor: pointer;
      font-size: 24px;
      color: #2c3e50;
      z-index: 1000;
    }

    .back-button svg {
      margin-right: 8px;
      width: 24px;
      height: 24px;
      fill: currentColor;
    }

    .header-container {
      position: relative;
      padding-top: 60px;
    }

    /* Мобильные стили */
    @media (max-width: 768px) {
      h1 {
        font-size: 20px;
        margin-bottom: 8px;
        padding: 0 10px;
      }

      #callStatus {
        font-size: 14px;
        margin-bottom: 15px;
        padding: 0 10px;
      }

      #participants {
        gap: 20px;
        margin-bottom: 20px;
        align-items: center;
      }

      .participant {
        width: 140px;
        padding: 15px;
        font-size: 16px;
      }

      .avatar-call {
        width: 100px;
        height: 100px;
        margin-bottom: 10px;
      }

      .name {
        font-size: 16px;
        margin-bottom: 8px;
      }

      #call-controls {
        gap: 10px;
        margin-bottom: 15px;
        padding: 0 10px;
      }

      button {
        padding: 12px 20px;
        font-size: 14px;
        flex: 1;
        min-width: 120px;
      }

      .back-button {
        top: 10px;
        left: 10px;
        font-size: 18px;
        padding: 6px 10px;
      }

      .back-button svg {
        width: 18px;
        height: 18px;
      }

      .header-container {
        padding-top: 50px;
      }
    }

    /* Для очень маленьких экранов */
    @media (max-width: 480px) {
      h1 {
        font-size: 18px;
      }

      #callStatus {
        font-size: 13px;
      }

      .participant {
        width: 120px;
        padding: 10px;
      }

      .avatar-call {
        width: 60px;
        height: 60px;
      }

      .name {
        font-size: 14px;
      }

      button {
        padding: 10px 16px;
        font-size: 13px;
        min-width: 100px;
      }

      #call-controls {
        flex-direction: column;
        align-items: center;
      }

      #call-controls button {
        width: 90%;
        max-width: 200px;
      }
    }

    /* Ландшафтная ориентация на мобильных */
    @media (max-width: 768px) and (orientation: landscape) {
      #participants {
        flex-direction: row;
        gap: 15px;
      }

      .participant {
        width: 120px;
        padding: 10px;
      }

      .avatar-call {
        width: 70px;
        height: 70px;
      }

      .name {
        font-size: 14px;
      }

      h1 {
        font-size: 18px;
      }

      .header-container {
        padding-top: 40px;
      }
    }
</style>





<div class="all_modal">
    <div class="header-container">
    <!-- Кнопка "Назад" с SVG стрелкой -->
    <button class="back-button" onclick="history.back()" aria-label="Вернуться назад" style="display:none">
      <!-- SVG стрелки влево -->
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      Назад
    </button>

    <h1>Аудиозвонок с {{ other_user.username }}</h1>
  </div>
  <!-- Статус звонка -->
  <div id="callStatus">Ожидание начала звонка...</div>

  <!-- Блок участников -->
  <div id="participants">
    <div id="caller" class="participant" data-user-id="{{ user.id }}">
      <div class="avatar-call"><img src="{{ user.avatar.url }}" alt="Аватар вызвавшего" /></div>
      <div class="name">{{ user.username }}</div>
    </div>
    <div id="callee" class="participant" data-user-id="{{ other_user.id }}">
      <div class="avatar-call"><img src="{{ other_user.avatar.url }}" alt="Аватар вызываемого" /></div>
      <div class="name">{{ other_user.username }}</div>
    </div>
  </div>

  <!-- Кнопки управления -->
  <div id="call-controls">
    <button id="callBtn">Начать звонок</button>
    <button id="cancelBtn">Скинуть</button>
    <button id="muteBtn" style="display:none;">Выключить микрофон</button>
  </div>

  <!-- Аудио элементы -->
  <audio id="localAudio" autoplay muted playsinline></audio>
    <audio id="remoteAudio" autoplay playsinline></audio>

</div>
<script>
  const callId = "{{ call_id }}";
  const userId = "{{ user.id }}";
  const otherUserId = "{{ other_user.id }}";
  const urlParams = new URLSearchParams(window.location.search);
  const incoming = urlParams.get('incoming');

  if (incoming === 'true') {
    // Автоматически начать звонок или показать уведомление
    // Например, автоматически нажать кнопку "Начать звонок"
    document.getElementById('callBtn').click();
  }
<!--  const wsUrl = `ws://${location.host}/ws/call/${callId}/`;-->
  const protocol = window.location.protocol === 'https:' ? 'wss' : 'ws';
  const ws = new WebSocket(`${protocol}://${window.location.host}/ws/call/${callId}/`);
  ws.onopen = () => console.log('Open');
  ws.onerror = (e) => console.error('Error', e);

  let localStream;
  let peerConnection;
  let isWebSocketOpen = false;
  const messageQueue = [];

  const callerDiv = document.getElementById('caller');
  const calleeDiv = document.getElementById('callee');

  const participants = {
    [userId]: callerDiv,
    [otherUserId]: calleeDiv
  };

  // Элементы интерфейса
  const callBtn = document.getElementById('callBtn');
  const cancelBtn = document.getElementById('cancelBtn');
  const muteBtn = document.getElementById('muteBtn');
  const callStatusDiv = document.getElementById('callStatus');
  console.log(cancelBtn)
  // Функции обновления статуса
  function updateCallStatus(message) {
    callStatusDiv.textContent = message;
  }

  function updateUIOnCallStart() {
    console.log(cancelBtn)

    if (callBtn) callBtn.style.display = 'none';
    if (cancelBtn) {
      cancelBtn.style.display = 'inline-block';
      cancelBtn.style.display = 'inline-block';
    }
    if (muteBtn) {
      muteBtn.style.display = 'inline-block';
      muteBtn.textContent = "Выключить микрофон";
    }
    updateCallStatus("Звонок активен");
  }

  function updateUIOnCallEnd() {
    if (callBtn) callBtn.style.display = 'inline-block';
    if (cancelBtn) {
      cancelBtn.style.display = 'none';
    }
    if (muteBtn) {
      muteBtn.style.display = 'none';
    }
    updateCallStatus("Звонок завершен");
  }

  // Функция подсветки говорящего
  function highlightSpeaker(userId) {
    Object.values(participants).forEach(div => {
      div.classList.remove('active');
    });
    if (participants[userId]) {
      participants[userId].classList.add('active');
    }
  }

  // Отправка сообщений через WebSocket
  function sendMessage(data) {
    const jsonData = JSON.stringify(data);
    if (isWebSocketOpen) {
      ws.send(jsonData);
    } else {
      messageQueue.push(jsonData);
    }
  }

  // Обработка WebSocket
  ws.onopen = () => {
    console.log('WebSocket connection opened');
    isWebSocketOpen = true;
    while (messageQueue.length > 0) {
      ws.send(messageQueue.shift());
    }

    initPeerConnection();
    requestMicrophoneAccess();

    // Если звонок уже начат, обновим UI
    {% if call_started %}
      updateUIOnCallStart();
    {% endif %}
    updateCallStatus("Ожидание соединения...");
  };

  ws.onmessage = async (event) => {
    const data = JSON.parse(event.data);
    if (data.type === 'incoming_call') {
        showIncomingCallNotification(data.call_id, data.caller_id);
    } else if (data.type === 'hangup') {
        endCall();
        updateCallStatus("Звонок завершен");
    } else {
      if (data.sender === userId) return; // игнорировать свои сообщения

      switch (data.type) {
        case 'offer':
          if (!peerConnection) {
            initPeerConnection();
          }
          await peerConnection.setRemoteDescription(new RTCSessionDescription(data.offer));
          const answer = await peerConnection.createAnswer();
          await peerConnection.setLocalDescription(answer);
          sendMessage({ type: 'answer', answer: peerConnection.localDescription, sender: userId });
          break;
        case 'answer':
          await peerConnection.setRemoteDescription(new RTCSessionDescription(data.answer));
          break;
        case 'ice-candidate':
          await peerConnection.addIceCandidate(new RTCIceCandidate(data.candidate));
          break;
        case 'hangup':
          endCall();
          break;
    }
    }
};

  // Инициализация PeerConnection
  function initPeerConnection() {
    peerConnection = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });

    peerConnection.onicecandidate = (event) => {
      if (event.candidate) {
        sendMessage({ type: 'ice-candidate', candidate: event.candidate, sender: userId });
      }
    };

    peerConnection.ontrack = (event) => {
      const remoteAudio = document.getElementById('remoteAudio');
      if (remoteAudio.srcObject !== event.streams[0]) {
          remoteAudio.srcObject = event.streams[0];
          remoteAudio.muted = false;
          remoteAudio.play().catch(err => console.warn('Autoplay blocked:', err));
      }
    };


  // Запрос микрофона и добавление трека
  function requestMicrophoneAccess() {
    navigator.mediaDevices.getUserMedia({ audio: true, video: false })
      .then(stream => {
        localStream = stream;
        document.getElementById('localAudio').srcObject = stream;
        if (peerConnection) {
          stream.getTracks().forEach(track => peerConnection.addTrack(track, stream));
        }
      })
      .catch(error => {
        alert("Не удалось получить доступ к микрофону");
        console.error(error);
      });
  }

  // Обработчик для кнопки "Начать звонок"
  if (callBtn) {
    callBtn.onclick = () => {
      if (!peerConnection) {
        initPeerConnection();
      }
      navigator.mediaDevices.getUserMedia({ audio: true, video: false }).then(stream => {
        localStream = stream;
        document.getElementById('localAudio').srcObject = stream;
        stream.getTracks().forEach(track => peerConnection.addTrack(track, stream));

        peerConnection.createOffer()
          .then(offer => {
            return peerConnection.setLocalDescription(offer);
          })
          .then(() => {
            updateUIOnCallStart(); // Показываем "Скинуть" и "Выключить микрофон"
            updateCallStatus("Звонок идет...");
            sendMessage({ type: 'offer', offer: peerConnection.localDescription, sender: userId });
          })
          .catch(error => {
            alert("Ошибка при создании предложения");
            console.error(error);
          });
      }).catch(error => {
        alert("Не удалось получить доступ к микрофону");
        console.error(error);
      });
    };
  }

  // Обработчик для кнопки "Скинуть"
  if (cancelBtn) {
    cancelBtn.onclick = () => {
      endCall();
      sendMessage({ type: 'hangup', sender: userId });
      updateUIOnCallEnd();
    };
  }

  // Обработчик для кнопки "Выключить микрофон"
  if (muteBtn) {
    let micMuted = false;
    muteBtn.onclick = () => {
      if (!localStream) return;
      localStream.getAudioTracks().forEach(track => {
        track.enabled = !track.enabled;
      });
      micMuted = !micMuted;
      muteBtn.textContent = micMuted ? "Включить микрофон" : "Выключить микрофон";
    };
  }

  // Завершение звонка
  function endCall() {
    if (peerConnection) {
        peerConnection.close();
        peerConnection = null;
    }
    if (localStream) {
        localStream.getTracks().forEach(track => track.stop());
        localStream = null;
    }

    // Останавливаем все аудио
    const localAudio = document.getElementById('localAudio');
    const remoteAudio = document.getElementById('remoteAudio');
    if (localAudio) {
        localAudio.srcObject = null;
        localAudio.pause();
    }
    if (remoteAudio) {
        remoteAudio.srcObject = null;
        remoteAudio.pause();
    }

    // Сбрасываем подсветку говорящего
    Object.values(participants).forEach(div => {
        div.classList.remove('active');
    });

    updateUIOnCallEnd();
}


if (cancelBtn) {
    cancelBtn.onclick = async () => {
        // Немедленно закрываем модальное окно
        const modal = document.getElementById('callModal');
        if (modal) {
            const bootstrapModal = bootstrap.Modal.getInstance(modal);
            if (bootstrapModal) {
                bootstrapModal.hide(); // закрываем модалку сразу
            }
        }

        // Отправляем сигнал о завершении звонка через WebSocket
        sendMessage({ type: 'hangup', sender: userId });

        // Запускаем асинхронные операции в фоне
        try {
            await fetch(`/call/${callId}/hangup/`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': getCookie('csrftoken')
                },
                body: JSON.stringify({})
            });
            console.log('Call successfully ended on server');
        } catch (error) {
            console.error('Error ending call on server:', error);
        }

        // Завершаем звонок на клиенте
        endCall();

        // Можно делать редирект или ничего не делать
    };
}


// Функция для получения CSRF токена
function getCookie(name) {
    let cookieValue = null;
    if (document.cookie && document.cookie !== '') {
        const cookies = document.cookie.split(';');
        for (let i = 0; i < cookies.length; i++) {
            const cookie = cookies[i].trim();
            if (cookie.substring(0, name.length + 1) === (name + '=')) {
                cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                break;
            }
        }
    }
    return cookieValue;
}

  // Детектор говорящего (упрощённый)
  function detectSpeaking(stream) {
    const context = new AudioContext();
    const source = context.createMediaStreamSource(stream);
    const analyser = context.createAnalyser();
    source.connect(analyser);
    analyser.fftSize = 512;
    const dataArray = new Uint8Array(analyser.fftSize);

    function analyze() {
      analyser.getByteTimeDomainData(dataArray);
      const rms = Math.sqrt(dataArray.reduce((sum, val) => sum + (val - 128) ** 2, 0) / dataArray.length);
      // Предположим, что говорящий — это текущий пользователь
      highlightSpeaker(userId);
      setTimeout(analyze, 10);
    }
    analyze();
  }




  // Функция отображения уведомления о входящем звонке
  function showIncomingCallNotification(callId, callerId) {
    // Создаем элемент уведомления
    const notification = document.createElement('div');
    notification.id = 'incomingCallNotification';
    notification.style.position = 'fixed';
    notification.style.top = '20px';
    notification.style.right = '20px';
    notification.style.backgroundColor = '#fff';
    notification.style.border = '2px solid #2980b9';
    notification.style.borderRadius = '8px';
    notification.style.padding = '15px';
    notification.style.boxShadow = '0 4px 8px rgba(0,0,0,0.2)';
    notification.style.zIndex = '1000';

    // Получить имя вызывающего (можно через API или из данных)
    const callerName = "{{ user.username }}"; // или сделать AJAX-запрос, чтобы получить имя по callerId

    notification.innerHTML = `
      <strong>Входящий звонок от ${callerName}</strong><br>
      <button id="acceptCallBtn">Принять</button>
      <button id="rejectCallBtn">Отклонить</button>
    `;

    document.body.appendChild(notification);

    document.getElementById('acceptCallBtn').onclick = () => {
      // Перейти к странице звонка или начать звонок
      // Можно открыть страницу звонка с параметром call_id
      window.location.href = `/call/${callId}/?incoming=true`;
    };

    document.getElementById('rejectCallBtn').onclick = () => {
      // Отправить сигнал о отклонении
      sendMessage({ type: 'hangup', sender: "{{ user.id }}", call_id: callId });
      document.body.removeChild(notification);
    };
  }
</script>
</body>
