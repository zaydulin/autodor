<form id="pathResponsibilityForm"
      method="post"
      hx-post="{% url 'moderation:update_responsibility' %}"
      hx-target="#pathResponsibilityList"
      hx-swap="innerHTML"
      hx-on="htmx:afterOnLoad: closePathResponsibilityModal()">

    {% csrf_token %}
    <input type="hidden" name="application_id" value="{{ application.id }}">
    <input type="hidden" name="responsibility_id" value="{% if pr %}{{ pr.id }}{% endif %}">

    <div class="row g-3">
        <!-- Выбор этапа (path_choice) -->
        <div class="col-md-6">
            <label class="form-label small mb-1">Этап (Путь)</label>
            <select class="form-select form-select-sm" name="path_choice_id" id="pathChoice" required data-paths="all">
                <option value="">— выберите этап —</option>
                {% for path in paths %}
                  <option value="{{ path.id }}"
                    {% if pr and pr.path_choice_id|stringformat:"s" == path.id|stringformat:"s" %}selected{% endif %}>
                    {{ path.name }}
                  </option>
                {% endfor %}
            </select>
        </div>

        <!-- Статус -->
        <div class="col-md-6">
            <label class="form-label small mb-1">Статус</label>
            <select class="form-select form-select-sm" name="status" id="respStatus" required>
                {% if status_choices %}
                  {% for code,label in status_choices %}
                    <option value="{{ code }}"
                      {% if pr and pr.status|stringformat:"s" == code|stringformat:"s" %}selected{% endif %}>
                      {{ label }}
                    </option>
                  {% endfor %}
                {% else %}
                  <option value="0" {% if pr and pr.status|stringformat:"s" == "0" %}selected{% endif %}>В ожидании</option>
                  <option value="1" {% if pr and pr.status|stringformat:"s" == "1" %}selected{% endif %}>Принял</option>
                  <option value="2" {% if pr and pr.status|stringformat:"s" == "2" %}selected{% endif %}>Закончил</option>
                {% endif %}
            </select>
        </div>

        <!-- Ответственный -->
        <div class="col-md-6">
            <label class="form-label small mb-1">Ответственный</label>
            <select class="form-select form-select-sm" id="responsibleSelect" name="responsible_id" required data-user="all">
                <option value="">— выберите ответственного —</option>
                {% for men in application.user_drivers.all %}
                  <option value="{{ men.id }}" {% if pr and pr.responsible_id|stringformat:"s" == men.id|stringformat:"s" %}selected{% endif %}>
                    {{ men.get_full_name }} — {{ men.get_role_display }}
                  </option>
                {% endfor %}
                {% for men in application.user_menager.all %}
                  <option value="{{ men.id }}" {% if pr and pr.responsible_id|stringformat:"s" == men.id|stringformat:"s" %}selected{% endif %}>
                    {{ men.get_full_name }} — {{ men.get_role_display }}
                  </option>
                {% endfor %}
            </select>
        </div>

        <!-- Дополнение -->
        <div class="col-md-6">
            <label class="form-label small mb-1">Дополнения</label>
            <input type="text"
                   class="form-control form-control-sm"
                   id="additionalInput"
                   name="additional"
                   value="{% if pr %}{{ pr.additional|escape }}{% endif %}">
        </div>
    </div>

    <div class="mt-3 d-flex justify-content-end gap-2">
        <button type="button" class="btn btn-light" data-bs-dismiss="modal">Отмена</button>
        <button type="submit" class="btn btn-primary">Сохранить</button>
    </div>
</form>
<script>
function closePathResponsibilityModal(modalId) {
    const modalEl = document.getElementById(modalId);
    if (!modalEl) return;

    let modalInstance = bootstrap.Modal.getInstance(modalEl);
    if (!modalInstance) {
        modalInstance = new bootstrap.Modal(modalEl);
    }

    // Скрываем модалку
    modalInstance.hide();

    // Ждём полного скрытия модала
    modalEl.addEventListener('hidden.bs.modal', function cleanup() {
        // Удаляем backdrop
        document.querySelectorAll('.modal-backdrop').forEach(el => el.remove());
        // Снимаем класс modal-open с body
        document.body.classList.remove('modal-open');

        // Отвязываем обработчик
        modalEl.removeEventListener('hidden.bs.modal', cleanup);
    });
}

// HTMX обработчик: после успешного обновления закрываем модалку
document.body.addEventListener('htmx:afterSwap', function(event) {
    if (event.target.id === 'pathResponsibilityList') {
        closePathResponsibilityModal('AddEtapeModal');  // укажи свой id
        closePathResponsibilityModal('editStageModal'); // если есть второй модал
    }
});
</script>
