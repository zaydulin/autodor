services:
  cb-redis:
    image: redis:latest
    container_name: cb-redis
    restart: always
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - cb-redis-data:/data
    env_file:
      - .env
    networks:
      - cb-net

  cb-db:
    image: postgres:14-alpine
    container_name: cb-db
    command: [ "postgres", "-c", "max_connections=1000" ]
    restart: always
    env_file:
      - .env
    environment:
      PG_DATA: /var/lib/postgresql/data
    volumes:
      - cb-db-data:/var/lib/postgresql/data
    ports:
      - "5433:5432"  # Измените внешний порт на 5433
    networks:
      - cb-net

  cb-app:
    build:
      context: .
      dockerfile: _config/app/Dockerfile
    container_name: cb-app
    command: bash run.sh
    env_file:
      - .env
    environment:
      WAIT_HOSTS: cb-db:5432,cb-redis:6379
    volumes:
      - ./src:/app/marketplace
    ports:
      - "8000:8000"
      - "8001:8001"
    tty: true
    restart: on-failure
    depends_on:
      - cb-db
      - cb-redis
    networks:
      - cb-net

  cb-celery:
    build:
      context: .
      dockerfile: _config/app/Dockerfile
    container_name: cb-celery
    command: celery --app _project worker --beat -l info --concurrency=10
    env_file:
      - .env
    environment:
      WAIT_HOSTS: cb-db:5432,cb-redis:6379
    volumes:
      - ./src:/app/marketplace
    restart: always
    depends_on:
      - cb-db
      - cb-redis
    networks:
      - cb-net

volumes:
  cb-db-data:
  cb-redis-data:

networks:
  cb-net:
    driver: bridge
